services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: time-attendance-api
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/express_mongoose_starter
      JWT_SECRET: dev-access-secret
      JWT_REFRESH_SECRET: dev-refresh-secret
    depends_on:
      mongo:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  mongo:
    image: mongo:7
    container_name: time-attendance-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: express_mongoose_starter
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data:
